services:

  db:
    image: postgres:17-alpine
    container_name: personal_finance_db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - personal_finance_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  backend:
    build:
      context: .

    container_name: personal_finance_backend

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}?currentSchema=expensetrackerapp
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-10800000}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081}

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped


  frontend:
    build:
      context: ../personal-finance-application-frontend

    container_name: personal_finance_frontend

    ports:
      - "${APP_PORT:-8081}:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  personal_finance_postgres_data: